level:
  document: 3
  n: 25
  b: 5
  layers: 5
  threshold_intrusion: 19
  axis_angle: 14.4
dataset:
  samples_per_class: 1000
  image_size: 224
  seed: 42
  split:
    train: 0.7
    val: 0.15
training:
  model: convnext_tiny
  epochs: 25
  batch_size: 32
  learning_rate: 0.0001
  lr_step_size: 7
  lr_gamma: 0.1
  num_workers: 4
  historical_baseline: resnet34


